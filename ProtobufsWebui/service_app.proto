
message CApp_GetCachedDetails_Request {
	optional uint32 appid = 1;
}

message CApp_GetCachedDetails_Response {
	optional string details = 1;
}

message CApp_SetCachedDetails_Request {
	optional uint32 appid = 1;
	optional string details = 2;
}

message CApp_SetCachedDetails_Response {
}

service App {
	// ePrivilege=1, eClientExecutionSite=1
	rpc GetCachedDetails (.CApp_GetCachedDetails_Request) returns (.CApp_GetCachedDetails_Response);
	// ePrivilege=1, eClientExecutionSite=1
	rpc SetCachedDetails (.CApp_SetCachedDetails_Request) returns (.CApp_SetCachedDetails_Response);
}

